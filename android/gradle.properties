# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true

# Jetpack Compose
android.enableNonTransitiveRClasses=true
android.suppressUnsupportedCompileSdk=36

# Kotlin code style
kotlin.code.style=official

# JVM memory for Gradle daemon — kept conservative to avoid OOM kills
# on memory-constrained environments.
org.gradle.jvmargs=-Xmx1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Enable parallel compilation
org.gradle.parallel=false
org.gradle.workers.max=1

# Enable build caching
org.gradle.caching=false

# Configure on-demand
org.gradle.configureondemand=false

# Kotlin incremental compilation
kotlin.incremental=true

# Free memory on OOM
org.gradle.daemon=true
org.gradle.java.home=/home/z/my-project/jdk/jdk-21.0.12.1+1
